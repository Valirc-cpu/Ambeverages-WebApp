services:
  - type: web
    name: ambeverages
    runtime: docker
    plan: free
    region: singapore
    branch: master
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Ambeverages
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        generateValue: true
      - key: APP_KEY
        generateValue: true
      - key: WHATSAPP_ADMIN_NUMBER
        value: "6289620378128"
      - key: ADMIN_NAME
        value: "Admin Ambeverages"
      - key: ADMIN_EMAIL
        value: "admin@example.com"
      - key: ADMIN_PASSWORD
        value: "password"
      - key: DB_CONNECTION
        value: sqlite
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: public
